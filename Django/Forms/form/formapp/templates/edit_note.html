<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/form.css' %}">
</head>

<body>
    {% include 'components/navbar.html' %}

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-edit"></i> Edit Note</h3>
                    </div>
                    <div class="card-body">
                        <form method="post" action="{% url 'edit_note' note.id %}">
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                            <span aria-hidden="true">&times;</span>
                                        </button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                            
                            {% csrf_token %}
                            
                            <div class="form-group">
                                <label for="title">Note Title</label>
                                <input name="title" type="text" id="title" class="form-control" 
                                       placeholder="Enter Note Title" value="{{ note.title }}" required>
                            </div>

                            <div class="form-group">
                                <label for="desc">Note Description</label>
                                <textarea name="description" rows="5" id="desc" class="form-control"
                                          placeholder="Enter Note Description" required>{{ note.description }}</textarea>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Update Note
                                </button>
                                <a href="{% url 'form_save_data' %}" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YfRvdZ8fWOHOOQFcqmjrvCYbOdgFB/wgDT7YJcUkGP3v/wKS+8hGqfpO3gf5M="
            crossorigin="anonymous"></script>
</body>
</html>
